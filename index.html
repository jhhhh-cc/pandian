  state.rangeMode = false;
  state.rangePick = null;
  $('btnRangeMode').classList.remove('active');
  hideBanner();
}
function pickRangePoint(r, c) {
  var p = state.rangePick;
  if (!p) {
    state.rangePick = { r1: r, c1: c, r2: r, c2: c };
    renderGrid();
    return;
  }
  state.range = norm(p.r1, p.c1, r, c);
  exitRangeMode();
  renderGrid();
  openRangePanel();
}
function headerRowTap(r) {
  var lay = getLayout(state.activeSheet);
  state.pickForImage = false;
  exitRangeMode();
  state.range = { r1: r, c1: 0, r2: r, c2: lay.maxC };
  renderGrid();
  openRangePanel();
}
function headerColTap(c) {
  var lay = getLayout(state.activeSheet);
  state.pickForImage = false;
  exitRangeMode();
  state.range = { r1: 0, c1: c, r2: lay.maxR, c2: c };
  renderGrid();
  openRangePanel();
}
function selAsRange() {
  if (state.sel.r < 0) return null;
  return { r1: state.sel.r, c1: state.sel.c, r2: state.sel.r, c2: state.sel.c };
}
function switchSheet(name) {
  state.activeSheet = name;
  state.sel = { r: -1, c: -1 };
  state.range = null; state.rangePick = null;
  $('gridScroll').scrollTop = 0;
  $('gridScroll').scrollLeft = 0;
  renderTabs();
  renderGrid();
}
function renderTabs() {
  $('sheetTabs').innerHTML = '';
  for (var i = 0; i < state.sheetNames.length; i++) {
    var n = state.sheetNames[i];
    var b = document.createElement('button');
    b.className = 'stab' + (n === state.activeSheet ? ' on' : '');
    b.textContent = n;
    b.dataset.name = n;
    $('sheetTabs').appendChild(b);
  }
}

/* ================================================================
 * 十一、文件库（IndexedDB 持久化）/ 盘点模式 / 保存分享
 * ================================================================ */

/* ---------- 本地文件库：IndexedDB 存工作副本，不可用时降级内存 ---------- */
var DB_NAME = 'xls-editor-db', DB_STORE = 'files';
var _db = null, _dbMem = new Map(), _dbOK = typeof indexedDB !== 'undefined';
var persistTimer = null;

function dbOpen() {
  return new Promise(function (res, rej) {
    if (!_dbOK) { res(null); return; }
    if (_db) { res(_db); return; }
    try {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        if (!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE, { keyPath: 'id' });
      };
      req.onsuccess = function () { _db = req.result; res(_db); };
      req.onerror = function () { _dbOK = false; res(null); };
    } catch (e) { _dbOK = false; res(null); }
  });
}
function dbTx(mode) {
  return _db.transaction([DB_STORE], mode).objectStore(DB_STORE);
}
function dbReq(r) { return new Promise(function (res, rej) { r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
function dbPut(rec) {
  return dbOpen().then(function (db) {
    if (!db) { _dbMem.set(rec.id, rec); return; }
    return dbReq(dbTx('readwrite').put(rec));
  });
}
function dbGetAll() {
  return dbOpen().then(function (db) {
    if (!db) return Array.from(_dbMem.values());
    return dbReq(dbTx('readonly').getAll());
  });
}
function dbGet(id) {
  return dbOpen().then(function (db) {
    if (!db) return _dbMem.get(id);
    return dbReq(dbTx('readonly').get(id));
  });
}
function dbDelete(id) {
  return dbOpen().then(function (db) {
    if (!db) { _dbMem.delete(id); return; }
    return dbReq(dbTx('readwrite').delete(id));
  });
}
function genId() { return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function setsToObj(sets) { var o = {}; for (var k in sets) o[k] = Array.from(sets[k]); return o; }

/** 生成当前工作副本的完整 xlsx 字节（含图片/复选框注入 + 原样式与下拉选项放回） */
function buildWorkBytes() {
  var buf = XLSX.write(state.wb, { bookType: 'xlsx', type: 'array', cellStyles: true });
  var p = Promise.resolve(buf);
  if (typeof JSZip !== 'undefined' && (countImages() > 0 || countCheckboxes() > 0)) p = injectExtras(buf);
  return p.then(function (b) { return applyOrigStyles(b); }).catch(function () { return buf; });
}

/** 把当前工作副本写入文件库（自动保存，防抖） */
function persistNow() {
  if (!state.wb) return;
  clearTimeout(persistTimer);
  buildWorkBytes().then(function (bytes) {
    var rec = {
      id: state.fileId || genId(),
      name: state.fileName || '工作簿.xlsx',
      bytes: bytes,
      images: JSON.stringify(state.images),
      cbs: JSON.stringify(setsToObj(state.checkboxSets)),
      style: JSON.stringify(state.origStyle || { styles: null, theme: null, sheetS: {} }),
      updatedAt: Date.now()
    };
    dbPut(rec).then(function () { state.fileId = rec.id; });
  }).catch(function () { /* 存储失败不影响编辑 */ });
}
function schedulePersist() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(persistNow, 800);
}

/* ---------- 首页（文件库列表：打开 / 删除 / 添加） ---------- */
function renderHome() {
  dbGetAll().then(function (list) {
    list.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    var box = $('fileList');
    box.innerHTML = '';
    if (!list.length) {
      box.innerHTML = '<div class="home-empty">还没有保存的表格<br>点右下角「＋ 添加 Excel」导入第一个表格<br><br>导入后会自动识别红色表头列为待填写项，<br>填完自动保存在这里，随时打开继续填</div>';
      return;
    }
    for (var i = 0; i < list.length; i++) {
      (function (rec) {
        var item = document.createElement('div');
        item.className = 'file-item';
        var d = new Date(rec.updatedAt);
        var timeStr = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
          String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        item.innerHTML =
          '<button class="fi-del" data-id="' + rec.id + '">✕</button>' +
          '<div class="fi-name"></div>' +
          '<div class="fi-meta">更新于 ' + timeStr + '</div>' +
          '<div class="fi-actions">' +
          '<button class="fi-btn open" data-id="' + rec.id + '">📂 打开</button>' +
          '<button class="fi-btn del" data-id="' + rec.id + '">🗑 删除</button>' +
          '</div>';
        item.querySelector('.fi-name').textContent = rec.name;
        box.appendChild(item);
      })(list[i]);
    }
  });
}
function deleteSaved(id, name) {
  showConfirm('删除表格', '确定从文件库删除「' + name + '」吗？设备上的原文件不受影响。',
    function () { dbDelete(id).then(renderHome); }, '删除', true);
}
/** 打开文件库中保存的工作副本（文本/图片/复选框/样式/下拉全部恢复） */
function openSaved(id) {
  dbGet(id).then(function (rec) {
    if (!rec) { toast('记录不存在'); return; }
    showLoading('正在打开…');
    try {
      var wb = XLSX.read(rec.bytes, { type: 'array', cellStyles: true, cellText: true, cellNF: true });
      // 保存副本里已含样式与下拉，重新提取以便再次导出时不丢
      var prep = (typeof JSZip !== 'undefined')
        ? extractOrigParts(rec.bytes, wb.SheetNames).catch(function () { return null; })
        : Promise.resolve(null);
      prep.then(function (orig) {
        initStateFromWb(wb, rec.name, rec, orig);
        hideLoading();
        enterWorkflow();
      });
    } catch (e) { hideLoading(); toast('打开失败：文件数据损坏'); }
  });
}
/** 载入工作簿后的公共状态初始化（导入与打开共用） */
function initStateFromWb(wb, name, rec, orig) {
  state.wb = wb;
  state.fileName = name;
  state.fileId = (rec && rec.id) || genId();
  state.sheetNames = wb.SheetNames;
  state.checkboxSets = {};
  state.images = {};
  state.origStyle = orig || null;
  try {
    if (rec && rec.images) {
      var im = JSON.parse(rec.images);
      for (var n in im) for (var a in im[n]) {
        if (!state.images[n]) state.images[n] = {};
        state.images[n][a] = im[n][a];
      }
    }
    if (rec && rec.cbs) {
      var cb = JSON.parse(rec.cbs);
      for (var n2 in cb) state.checkboxSets[n2] = new Set(cb[n2]);
    }
    if (rec && rec.style) {
      var st = JSON.parse(rec.style);
      if (st && (st.styles || st.theme || st.sheetS)) state.origStyle = st;
    }
    if (orig && orig.dvs) {
      for (var n3 in orig.dvs) {
        var ws0 = state.wb.Sheets[n3];
        if (ws0) ws0['!dataValidation'] = orig.dvs[n3];
      }
    }
  } catch (e) { /* 恢复失败不阻塞 */ }
  state.undoStack = [];
  state.redoStack = [];
  state.sel = { r: -1, c: -1 };
  state.range = null; state.rangePick = null;
  state.rangeMode = false; state.pickForImage = false;
  state.search = { active: false, term: '', results: [], index: -1, matchSet: {}, curKey: null };
  state.inv = null;
  state.fillDraft = {}; // 填写页未保存输入的草稿
  restoreDraftBackup(); // 若上次编辑时被系统杀进程，恢复未保存的填写内容
  layoutCache.clear();
  cellEls.forEach(function (en) { en.el.remove(); });
  cellEls.clear();
  state.activeSheet = wb.SheetNames[0];
  $('uploadScreen').hidden = true;
  $('homeScreen').hidden = true;
  $('fileName').textContent = name;
  $('gridScroll').scrollTop = 0;
  $('gridScroll').scrollLeft = 0;
  renderTabs();
  updateUndoButtons();
  renderGrid();
}
/** 载入后决定进入盘点模式还是通用表格 */
function enterWorkflow() {
  var inv = detectFillCols();
  if (inv) {
    state.inv = inv;
    $('mainScreen').hidden = true;
    $('invScreen').hidden = false;
    renderInv();
    toast('已识别 ' + (inv.photoCols.length ? '填写列与拍照列' : '待填写列') + '，进入盘点模式');
  } else {
    $('mainScreen').hidden = false;
    $('invScreen').hidden = true;
  }
}

/* ---------- 红色表头列检测（红色填充 = 需要填写的列） ---------- */
function isRedFill(cell) {
  if (!cell || !cell.s) return false;
  // SheetJS 可能把 fill 摊平到 cell.s 顶层（patternType/fgColor 直接在 s 上），
  // 也可能是嵌套的 cell.s.fill 结构——两者都兼容
  var s = cell.s, fill = s.fill || s;
  if (fill.patternType !== 'solid' && !(fill.patternType == null && fill.fgColor)) return false;
  var rgb = fill.fgColor && fill.fgColor.rgb;
  if (!rgb || rgb.length < 6) return false;
  var R = parseInt(rgb.slice(rgb.length - 6, rgb.length - 4), 16);
  var G = parseInt(rgb.slice(rgb.length - 4, rgb.length - 2), 16);
  var B = parseInt(rgb.slice(rgb.length - 2), 16);
  return R >= 170 && G <= 120 && B <= 120;
}
function cellTxt(ws, r, c) {
  var cell = ws[rcToAddr(r, c)];
  if (!cell) return '';
  return cell.w != null ? String(cell.w) : (cell.v != null ? String(cell.v) : '');
}
/** 检测第一个含红色单元格的行作为表头行，红色列 = 待填写列 */
function detectFillCols() {
  if (!state.wb) return null;
  var name = state.sheetNames[0];
  var ws = state.wb.Sheets[name];
  if (!ws || !ws['!ref']) return null;
  var R = XLSX.utils.decode_range(ws['!ref']);
  var headerRow = -1, fillCols = [];
  for (var r = R.s.r; r <= Math.min(R.e.r, 20); r++) {
    var reds = [];
    for (var c = R.s.c; c <= R.e.c; c++) {
      if (isRedFill(ws[rcToAddr(r, c)])) reds.push(c);
    }
    if (reds.length) { headerRow = r; fillCols = reds; break; }
  }
  if (headerRow < 0) return null;
  var cols = [], photoCols = [];
  for (var k = 0; k < fillCols.length; k++) {
    var hdr = cellTxt(ws, headerRow, fillCols[k]);
    var isPhoto = /图片|照片|拍照/.test(hdr);
    cols.push({ c: fillCols[k], header: hdr, isPhoto: isPhoto });
    if (isPhoto) photoCols.push(fillCols[k]);
  }
  // 数据行：表头行以下、任一填写列或其所在行第一列非空的行
  var rows = [];
  for (var r2 = headerRow + 1; r2 <= R.e.r; r2++) {
    var has = false;
    for (var c2 = R.s.c; c2 <= R.e.c; c2++) { if (cellTxt(ws, r2, c2) !== '') { has = true; break; } }
    if (has) rows.push(r2);
  }
  var inv = { sheet: name, headerRow: headerRow, cols: cols, photoCols: photoCols, rows: rows };
  ensurePickValidations(inv); // 给可点选列写入下拉选项（数据验证），导出后在电脑上也能下拉选择
  return inv;
}

/* ---------- 盘点模式 ---------- */
var PICK_HDRS = ['使用状况', '记录状况'];          // 可点选选项的字段（表头含这些词）
var PICK_OPTIONS = {                                 // 可点选字段的固定选项（用户指定，一定出现）
  '使用状况': ['在用', '闲置', '报废', '未见'],
  '记录状况': ['完好', '较为完好', '损坏']
};
/**
 * 提取可点选字段的选项：仅「使用状况」「记录状况」类字段（表头含这些词）才给选项，
 * 选项 = 固定选项 + 该列（表头行以下）已有的不同内容（去重后追加在固定选项后面）。
 * 其余字段一律无选项（自由输入）。
 */
function buildPickOptions(inv, c) {
  var hdr = '';
  for (var j = 0; j < inv.cols.length; j++) if (inv.cols[j].c === c) hdr = inv.cols[j].header;
  var kind = '';
  for (var k = 0; k < PICK_HDRS.length; k++) if (hdr.indexOf(PICK_HDRS[k]) >= 0) { kind = PICK_HDRS[k]; break; }
  if (!kind || !PICK_OPTIONS[kind]) return [];
  var set = PICK_OPTIONS[kind].slice();
  var seen = {};
  for (var i = 0; i < set.length; i++) seen[set[i]] = 1;
  var ws = state.wb.Sheets[inv.sheet];
  for (var m = 0; m < inv.rows.length; m++) {
    var v = cellTxt(ws, inv.rows[m], c);
    if (v !== '' && !seen[v]) { seen[v] = 1; set.push(v); }
  }
  return set;
}
/**
 * 给可点选字段所在列写入 Excel 下拉选项（数据验证）：
 * 选项与问卷页一致（固定选项 + 列内已有值），覆盖全部数据行。
 * 幂等：重复进入/打开已保存副本时先移除本列旧下拉再写入，避免叠加。
 * 原文件里若本列与其它列共用一条下拉（如 T 列与 AB 列），替换时保留其它列的区域不丢。
 */
/**
 * 判断原下拉的某个区域是否值得保留：
 * 红色待填列里只有「使用状况/记录状况」这类可选项字段要有下拉，
 * 其它红色列（如实际使用部门）不再保留原下拉——导出文件里不要出现多余的下拉键。
 * 非红色普通数据列的原下拉一律保留。
 */
function keepRegionDv(inv, region) {
  var m = /^([A-Z]+)\d+/.exec(region);
  if (!m) return true;
  var p0 = addrToRC(m[1] + '1');
  if (!p0) return true;
  if (!inv.cols.some(function (x) { return x.c === p0.c; })) return true; // 非红色列：保留原下拉
  return buildPickOptions(inv, p0.c).length > 0; // 红色列：只有可选项字段保留
}
function ensurePickValidations(inv) {
  var ws = state.wb.Sheets[inv.sheet];
  if (!ws || !inv.rows.length) return;
  var minR = Math.min.apply(null, inv.rows), maxR = Math.max.apply(null, inv.rows);
  var dvs = ws['!dataValidation'] || (ws['!dataValidation'] = []);
  for (var k = 0; k < inv.cols.length; k++) {
    var col = inv.cols[k];
    var opts = buildPickOptions(inv, col.c);
    if (!opts.length) continue;
    var sqref = colName(col.c) + (minR + 1) + ':' + colName(col.c) + (maxR + 1);
    var colPat = new RegExp('^' + colName(col.c) + '\\d+:');
    var keptOthers = []; // 原下拉里非本列的区域（其它列与本列共用同一条下拉）
    for (var j = dvs.length - 1; j >= 0; j--) {
      var dv = dvs[j];
      if (!dv || dv.type !== 'list') continue;
      var parts = String(dv.sqref || '').split(/\s+/);
      var mine = false, rest = [];
      for (var p = 0; p < parts.length; p++) {
        if (colPat.test(parts[p])) mine = true; else if (parts[p]) rest.push(parts[p]);
      }
      if (mine) {
        for (var p2 = 0; p2 < rest.length; p2++) {
          if (keepRegionDv(inv, rest[p2])) keptOthers.push({ formula1: dv.formula1, sqref: rest[p2], allowBlank: dv.allowBlank, showDropDown: dv.showDropDown });
        }
        dvs.splice(j, 1);
      }
    }
    for (var q = 0; q < keptOthers.length; q++) {
      dvs.push({ type: 'list', allowBlank: keptOthers[q].allowBlank !== false, showDropDown: keptOthers[q].showDropDown !== false, formula1: keptOthers[q].formula1, sqref: keptOthers[q].sqref });
    }
    dvs.push({ type: 'list', allowBlank: true, showDropDown: true, formula1: '"' + opts.join(',') + '"', sqref: sqref });
  }
}
/** 该行填写完成度 */
function invRowStatus(r) {
  var inv = state.inv, ws = state.wb.Sheets[inv.sheet];
  var filled = 0, total = inv.cols.length, photos = 0;
  for (var k = 0; k < inv.cols.length; k++) {
    var col = inv.cols[k];
    if (col.isPhoto) {
      var arr = state.images[inv.sheet] && state.images[inv.sheet][rcToAddr(r, col.c)];
      if (arr && arr.length) { filled++; photos += arr.length; }
    } else if (cellTxt(ws, r, col.c) !== '') filled++;
  }
  return { filled: filled, total: total, photos: photos };
}
/** 问卷题目列：新增行（fillAll）时返回全部列表头（所有列都要填），平时返回红色待填列 */
function fillColsList() {
  var inv = state.inv;
  if (!state.fillAllCols || !inv) return inv.cols;
  var ws = state.wb.Sheets[inv.sheet];
  var R = XLSX.utils.decode_range(ws['!ref']);
  var out = [];
  for (var c = R.s.c; c <= R.e.c; c++) {
    var h = cellTxt(ws, inv.headerRow, c);
    if (h !== '') out.push({ c: c, header: h, isPhoto: /图片|照片|拍照/.test(h) });
  }
  return out;
}

/** 渲染盘点列表（每行一张卡片） */
/** 筛选字段：把条形码列提到首位（默认按条形码筛选），没有条形码列则保持原顺序 */
function putBarcodeFirst(headers) {
  for (var i = 0; i < headers.length; i++) {
    var h = headers[i].h;
    if (h.indexOf('条形码') >= 0 || h.indexOf('条码') >= 0) {
      if (i > 0) { var bc = headers.splice(i, 1)[0]; headers.unshift(bc); }
      return true;
    }
  }
  return false;
}

/** 新增一行盘点记录：在最后一行下方追加空行，继承上一行样式，随后直接打开问卷填写 */
function addInvRow() {
  var inv = state.inv;
  if (!inv) return;
  var ws = state.wb.Sheets[inv.sheet];
  var R = XLSX.utils.decode_range(ws['!ref']);
  var last = inv.rows.length ? inv.rows[inv.rows.length - 1] : inv.headerRow;
  var newR = last + 1;
  if (newR > R.e.r) { R.e.r = newR; ws['!ref'] = XLSX.utils.encode_range(R); }
  var map = state.origStyle && state.origStyle.sheetS && state.origStyle.sheetS[inv.sheet];
  for (var c = R.s.c; c <= R.e.c; c++) {
    var addr = rcToAddr(newR, c), prev = rcToAddr(last, c);
    var cell = { t: 's', v: '' };
    var pv = ws[prev];
    if (pv && pv.s) cell.s = pv.s; // 内存里继承上一行样式
    if (map && map[prev]) map[addr] = map[prev]; // 导出时新行也带上一行的边框等样式
    ws[addr] = cell;
  }
  state.inv = detectFillCols();
  if (!state.inv) { state.inv = inv; return; }
  if (state.inv.rows.indexOf(newR) < 0) state.inv.rows.push(newR);
  ensurePickValidations(state.inv); // 下拉选项覆盖到新行
  persistNow();
  renderInv();
  openFillPage(newR, true); // 直接打开问卷填写（含全部列表头）
  toast('已新增第 ' + (newR + 1) + ' 行，开始填写');
}

function renderInv() {
  var inv = state.inv;
  if (!inv) return;
  $('invTitle').textContent = state.fileName || '盘点';
  $('invSub').textContent = inv.rows.length + ' 条记录 · ' + inv.cols.length + ' 个填写项';
  var box = $('invList');
  box.innerHTML = '';
  var ws = state.wb.Sheets[inv.sheet];
  // 字段选择器：表头全部列（跳过拍照列）
  var sel = $('invFieldSel');
  sel.innerHTML = '';
  var headers = [];
  var R = XLSX.utils.decode_range(ws['!ref']);
  for (var c = R.s.c; c <= R.e.c; c++) {
    var h = cellTxt(ws, inv.headerRow, c);
    if (h !== '' && inv.photoCols.indexOf(c) < 0) headers.push({ c: c, h: h });
  }
  var hasBc = putBarcodeFirst(headers); // 条形码列提到首位
  for (var hk = 0; hk < headers.length; hk++) {
    var op = document.createElement('option');
    op.value = String(headers[hk].c);
    op.textContent = headers[hk].h;
    sel.appendChild(op);
  }
  if (hasBc) sel.value = String(headers[0].c); // 默认选中条形码列
  // 行卡片
  for (var i = 0; i < inv.rows.length; i++) {
    (function (r) {
      var st = invRowStatus(r);
      var no = cellTxt(ws, r, R.s.c);
      var nameTxt = '';
      for (var k2 = 1; k2 < Math.min(6, R.e.c + 1); k2++) { // 第 2 列起找资产名称等描述
        var v2 = cellTxt(ws, r, R.s.c + k2);
        if (v2 !== '') { nameTxt = v2; break; }
      }
      var card = document.createElement('div');
      card.className = 'inv-card';
      card.dataset.r = r;
      card.innerHTML =
        '<div class="ic-line1"><span class="ic-no"></span><span class="ic-badge ' + (st.filled >= st.total ? 'done' : 'todo') + '">' +
        (st.filled >= st.total ? '✓ 已完成' : st.filled + '/' + st.total + ' 项') + '</span></div>' +
        '<div class="ic-name"></div><div class="ic-fields"></div>';
      card.querySelector('.ic-no').textContent = no !== '' ? no : '第 ' + (r + 1) + ' 行';
      card.querySelector('.ic-name').textContent = nameTxt;
      var chipBox = card.querySelector('.ic-fields');
      for (var k3 = 0; k3 < inv.cols.length; k3++) {
        var col = inv.cols[k3];
        var chip = document.createElement('span');
        if (col.isPhoto) {
          var ph = st.photos;
          chip.className = 'ic-chip' + (ph ? ' photo' : '');
          chip.textContent = '📷 照片' + (ph ? ' ×' + ph : '');
        } else {
          var v3 = cellTxt(ws, r, col.c);
          chip.className = 'ic-chip' + (v3 !== '' ? ' filled' : '');
          chip.textContent = col.header + '：' + (v3 !== '' ? v3 : '待填');
        }
        chipBox.appendChild(chip);
      }
      box.appendChild(card);
    })(inv.rows[i]);
  }
  if (!inv.rows.length) $('invList').innerHTML = '<div class="home-empty">表格中没有数据行</div>';
}

/* ---------- 填写页（问卷式盘点：每字段一个问题） ---------- */
function openFillPage(r, fillAll) {
  var inv = state.inv;
  if (!inv) return;
  state.fillAllCols = !!fillAll; // 新增行的问卷：包含全部列表头
  var ws = state.wb.Sheets[inv.sheet];
  state.inv.cur = r;
  var idx = inv.rows.indexOf(r);
  var R = XLSX.utils.decode_range(ws['!ref']);
  var no = cellTxt(ws, r, R.s.c);
  // 完成度
  var st = invRowStatus(r);
  $('fillTitle').textContent = '记录 ' + (idx + 1) + ' / ' + inv.rows.length + '（已填 ' + st.filled + '/' + st.total + '）';
  $('fillSub').textContent = no || ('第 ' + (r + 1) + ' 行');
  var html = '';
  var qCols = fillColsList(); // 新增行（fillAll）时是全部列表头，平时是红色待填列
  // 顶部：被盘点物品信息（按表头关键词显示：条形码 / 名称 / 型号 / 存放地点 / 使用状况 / 使用部门名称，供对照）
  // 新增行的问卷所有列都要填、信息区无对照意义，跳过
  var infoParts = [];
  if (!state.fillAllCols) {
  var INFO_KEYS = ['条形码', '名称', '型号', '存放地点', '使用状况', '使用部门名称'];
  for (var ki = 0; ki < INFO_KEYS.length; ki++) {
    var kw = INFO_KEYS[ki];
    for (var c = R.s.c; c <= R.e.c; c++) {
      if (inv.cols.some(function (x) { return x.c === c; })) continue; // 跳过红色待填列（如「实际使用状况」）
      var h = cellTxt(ws, inv.headerRow, c);
      if (h.indexOf(kw) < 0) continue;
      var v = cellTxt(ws, r, c);
      infoParts.push('<b>' + escHtml(h) + '</b>：' + escHtml(v || '（未填）'));
      break; // 每个关键词只取第一个匹配列
    }
  }
  if (infoParts.length) html += '<div class="fill-sec"><div class="fs-label">📄 ' + (no || '本记录') + '</div><div class="fs-info">' + infoParts.join('　') + '</div></div>';
  }
  // 每个填写字段 = 一道问卷题
  var qNo = 0;
  for (var k = 0; k < qCols.length; k++) {
    var col = qCols[k];
    qNo++;
    var addr = rcToAddr(r, col.c);
    // 草稿优先：还没点「保存」的输入也不能丢（拍照/切换记录会重绘页面）
    var cur = (state.fillDraft && state.fillDraft[addr] !== undefined) ? state.fillDraft[addr] : cellTxt(ws, r, col.c);
    html += '<div class="fill-sec"><div class="fs-label">' + qNo + '. ' + escHtml(col.header) +
      (cur !== '' && !col.isPhoto ? ' <span class="q-done">✓ 已答</span>' : '') + '</div>';
    if (col.isPhoto) {
      var arr = state.images[inv.sheet] && state.images[inv.sheet][addr] || [];
      html += '<div class="fs-photos">';
      for (var p = 0; p < arr.length; p++) {
        html += '<div class="ph-wrap"><img src="' + arr[p].dataUrl + '"><button class="ph-del" data-addr="' + addr + '" data-idx="' + p + '">✕</button></div>';
      }
      html += '</div><button class="ph-btn" id="btnPhoto_' + addr + '">📷 拍照（第 ' + (arr.length + 1) + ' 张）</button>';
      html += '<div class="fs-info">可连续拍多张，互不覆盖</div>';
    } else {
      var opts = buildPickOptions(inv, col.c);
      if (opts.length) {
        html += '<div class="fs-opts">';
        for (var o = 0; o < opts.length; o++) {
          html += '<button class="opt-btn' + (cur === opts[o] ? ' on' : '') + '" data-addr="' + addr + '" data-val="' + escAttr(opts[o]) + '">' + escHtml(opts[o]) + '</button>';
        }
        html += '</div>';
      }
      html += '<textarea id="fi_' + addr + '" rows="2" placeholder="' + (opts.length ? '点上方选项，或直接输入' : '请输入内容') + '">' + escHtml(cur) + '</textarea>';
    }
    html += '</div>';
  }
  $('fillBody').innerHTML = html;
  $('fillMask').hidden = false;
}

/** 填写页选项按钮 / 照片删除（事件委托） */
function fillBodyAction(target) {
  var inv = state.inv;
  if (!inv) return;
  if (target.classList.contains('opt-btn')) {
    var addr = target.dataset.addr, val = target.dataset.val;
    var input = $('fi_' + addr);
    if (input) { input.value = val; }
    if (!state.fillDraft) state.fillDraft = {};
    state.fillDraft[addr] = val; // 选项也进草稿，拍照/切页不丢
    backupDraft();
    var btns = $('fillBody').querySelectorAll('.opt-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i] === target);
  } else if (target.classList.contains('ph-del')) {
    showConfirm('删除照片', '确定删除这张照片吗？（可撤销）',
      function () { flushFillDraft(); removeImage(inv.sheet, target.dataset.addr, parseInt(target.dataset.idx, 10)); openFillPage(inv.cur); }, '删除', true);
  } else if (target.id && target.id.indexOf('btnPhoto_') === 0) {
    state.pendingPhotoAddr = target.id.slice('btnPhoto_'.length);
    $('filePhoto').click();
  }
}

/* ---------- 未保存草稿的同步本地备份（防相机把浏览器杀掉后丢内容） ---------- */
var LS_DRAFT_KEY = 'inv-fill-draft-v4';
/** 把当前填写草稿同步写进 localStorage（同步写入，页面被杀也不丢） */
function backupDraft() {
  try {
    var inv = state.inv;
    if (!inv || !inv.sheet) return;
    var d = state.fillDraft || {};
    if (!Object.keys(d).length) { localStorage.removeItem(LS_DRAFT_KEY); return; }
    localStorage.setItem(LS_DRAFT_KEY, JSON.stringify({ name: state.fileName || '', sheet: inv.sheet, d: d }));
  } catch (e) { /* 私密模式等不可用则跳过 */ }
}
function clearDraftBackup() {
  try { localStorage.removeItem(LS_DRAFT_KEY); } catch (e) { /* 忽略 */ }
}
/** 重开同一文件时恢复被杀前未保存的草稿（文件名与工作表名都匹配才恢复） */
function restoreDraftBackup() {
  try {
    var s = localStorage.getItem(LS_DRAFT_KEY);
    if (!s) return;
    var b = JSON.parse(s);
    if (!b || !b.d || b.name !== (state.fileName || '')) return;
    if (state.wb && state.wb.Sheets[b.sheet]) state.fillDraft = b.d;
  } catch (e) { /* 忽略 */ }
}

/**
 * 把填写页当前行的草稿直接写进表格（不产生撤销步）。
 * 拍照、切换记录、返回列表前调用：配合自动保存，即使手机浏览器被系统杀掉重开，
 * 已填内容也已持久化，不会消失。
 */
function flushFillDraft() {
  var inv = state.inv;
  if (!inv || inv.cur == null) return;
  var ws = state.wb.Sheets[inv.sheet];
  var d = state.fillDraft || {};
  var changed = false;
  for (var addr in d) {
    if (!/^[A-Z]+\d+$/.test(addr)) continue;
    var p = addrToRC(addr);
    if (!p || p.r !== inv.cur) continue;
    var v = d[addr];
    var cur = cellTxt(ws, p.r, p.c);
    if (v === cur) continue;
    extendRef(ws, p.r, p.c);
    if (v === '') delete ws[addr];
    else if (/^\d+(\.\d+)?$/.test(v)) ws[addr] = { t: 'n', v: parseFloat(v), w: v };
    else ws[addr] = { t: 's', v: v };
    changed = true;
  }
  if (changed) persistNow(); // 立即持久化（相机可能杀掉页面，不等防抖）
  backupDraft(); // 同步备份草稿，进程被杀后重开也能恢复
}

/** 保存填写页：一次操作写入全部文本字段（一个撤销步） */
function saveFillPage() {
  var inv = state.inv;
  if (!inv) return;
  var r = inv.cur, ws = state.wb.Sheets[inv.sheet];
  var addrs = [], values = [];
  var svCols = fillColsList(); // 新增行问卷时保存全部列
  for (var k = 0; k < svCols.length; k++) {
    var col = svCols[k];
    if (col.isPhoto) continue;
    var addr = rcToAddr(r, col.c);
    var input = $('fi_' + addr);
    if (!input) continue;
    var v = input.value;
    var cur = cellTxt(ws, r, col.c);
    if (v === cur) continue;
    addrs.push(addr); values.push(v);
  }
  if (!addrs.length) { $('fillMask').hidden = true; renderInv(); toast('没有需要保存的改动'); schedulePersist(); state.fillDraft = {}; return; }
  var before = snapCells(inv.sheet, addrs);
  for (var i = 0; i < addrs.length; i++) {
    var p = addrToRC(addrs[i]);
    extendRef(ws, p.r, p.c);
    if (values[i] === '') delete ws[addrs[i]];
    else if (/^\d+(\.\d+)?$/.test(values[i])) ws[addrs[i]] = { t: 'n', v: parseFloat(values[i]), w: values[i] };
    else ws[addrs[i]] = { t: 's', v: values[i] };
  }
  var after = snapCells(inv.sheet, addrs);
  pushOp('盘点填写第 ' + (r + 1) + ' 行',
    function () { restoreSnap(inv.sheet, before); },
    function () { restoreSnap(inv.sheet, after); });
  $('fillMask').hidden = true;
  renderInv();
  afterOp('已保存第 ' + (r + 1) + ' 行，并已自动保存');
  persistNow(); // 立即自动保存进文件库（不等防抖）
  state.fillDraft = {}; // 保存成功后清空草稿
  clearDraftBackup();
  // 不自动弹分享框（用户要求：保存即静默自动保存）；需要分享时点顶部「⬇ 保存分享」
}

/* ---------- 盘点搜索：按表头字段 + 自动补全 ---------- */
var invSuggestTimer = null;
function invSearch() {
  clearTimeout(invSuggestTimer);
  invSuggestTimer = setTimeout(function () {
    var inv = state.inv;
    if (!inv) return;
    var term = $('invSearchInput').value.trim();
    var box = $('invSuggest');
    if (term === '') { box.style.display = 'none'; return; }
    var c = parseInt($('invFieldSel').value, 10);
    var ws = state.wb.Sheets[inv.sheet];
    var rowsByVal = {};
    for (var i = 0; i < inv.rows.length; i++) {
      var v = cellTxt(ws, inv.rows[i], c);
      if (v !== '' && v.toLowerCase().indexOf(term.toLowerCase()) >= 0) {
        if (!rowsByVal[v]) rowsByVal[v] = [];
        rowsByVal[v].push(inv.rows[i]);
      }
    }
    var vals = Object.keys(rowsByVal).slice(0, 20);
    if (!vals.length) { box.style.display = 'none'; return; }
    box.innerHTML = '';
    for (var k = 0; k < vals.length; k++) {
      (function (v) {
        var it = document.createElement('div');
        it.className = 'sg-item';
        it.textContent = v;
        it.addEventListener('click', function () {
          box.style.display = 'none';
          $('invSearchInput').value = v;
          state.inv.cur = rowsByVal[v][0];
          openFillPage(rowsByVal[v][0]);
        });
        box.appendChild(it);
      })(vals[k]);
    }
    box.style.display = 'block';
  }, 250);
}

/* ---------- 保存并分享到微信（系统分享面板） ---------- */
function shareOrDownload(buf) {
  var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var name = exportName();
  var file = new File([blob], name, { type: blob.type });
  var canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
  if (!canShare) { try { canShare = !!navigator.share; } catch (e) { canShare = false; } } // 部分浏览器无 canShare 但 share 可用
  if (canShare) {
    try {
      navigator.share({ files: [file], title: name, text: name }).then(function () {
        toast('已发送，请在打开的分享面板中选择「微信」');
      }).catch(function (e) {
        if (e && e.name === 'AbortError') { toast('已取消分享'); return; }
        showDownloadHelp(blob, name); // 系统分享失败（如页面停留过久失去手势授权）→ 兜底下载
      });
    } catch (e) {
      showDownloadHelp(blob, name);
    }
  } else {
    showDownloadHelp(blob, name);
  }
}
/** 不支持系统分享的浏览器（微信内置浏览器等）的兜底：下载按钮 + 换浏览器指引 */
function showDownloadHelp(blob, name) {
  showConfirm('文件已生成 ✅',
    '当前浏览器无法直接调起分享面板（微信内置浏览器通常如此）。\n\n' +
    '文件「' + name + '」已生成完毕，请任选一种方式发送：\n' +
    '① 点下方「下载文件」保存到手机；\n' +
    '② 在微信里点右上角「···」→「在浏览器打开」后再点「保存分享」；\n' +
    '③ 建议直接用手机自带浏览器（Safari / 浏览器）打开这个网页，点「保存分享」即可直接选择微信发送。',
    function () { downloadBlob(blob, name); }, '下载文件');
}

/* ---------- 界面切换 ---------- */
function goHome() {
  schedulePersist();
  state.inv = null;
  $('mainScreen').hidden = true;
  $('invScreen').hidden = true;
  $('fillMask').hidden = true;
  $('homeScreen').hidden = false;
  renderHome();
}
function enterInventoryMode() {
  var inv = detectFillCols();
  if (!inv) { toast('未检测到红色表头列，无法进入盘点模式（可在通用表格中编辑）'); return; }
  state.inv = inv;
  $('mainScreen').hidden = true;
  $('invScreen').hidden = false;
  renderInv();
}
function backToTable() {
  state.inv = null;
  $('invScreen').hidden = true;
  $('mainScreen').hidden = false;
  renderGrid();
}

/* ================================================================
 * 十二、初始化与事件绑定
 * ================================================================ */
var APP_VERSION = 'v4.10';
/** 检查更新：对比仓库里的 version.txt，提示用户是否要完全关闭后重开 */
function checkUpdate(showAlways) {
  try {
    fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var m = /v\d+\.\d+/.exec(t || '');
      if (!m) return;
      if (m[0] !== APP_VERSION) {
        toast('有新版本 ' + m[0] + '！请把 App 完全关闭后重新打开');
      } else if (showAlways) {
        toast('已是最新版 ' + APP_VERSION + ' ✓');
      }
    }).catch(function () { if (showAlways) toast('没连上网络，检查不了'); });
  } catch (e) {}
}

function initApp() {
  /* --- 上传 --- */
  $('verBadge').textContent = APP_VERSION;
  $('btnCheckVer').addEventListener('click', function () { checkUpdate(true); });
  checkUpdate(false); // 打开时静默检查，有新版本才提示
  $('btnPickFile').addEventListener('click', function () { $('fileXlsx').click(); });
  $('btnHelp').addEventListener('click', openHelp);
  $('btnHelpTop').addEventListener('click', openHelp);
  $('fileXlsx').addEventListener('change', function () {
    var f = $('fileXlsx').files && $('fileXlsx').files[0];
    $('fileXlsx').value = '';
    if (!f) return;
    if (f.size > 50 * 1024 * 1024) {
      showConfirm('文件较大', '该文件超过 50MB，手机浏览器可能卡顿甚至崩溃，确定继续加载吗？',
        function () { loadFile(f); }, '继续加载', true);
      return;
    }
    // 当前表格已自动保存在文件库中，直接导入新文件即可
    loadFile(f);
  });

  /* --- 首页文件库 --- */
  $('btnAddFile').addEventListener('click', function () { $('fileXlsx').click(); });
  $('fileList').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-id]') : null;
    if (!b) return;
    var id = b.dataset.id;
    if (b.classList.contains('del')) {
      var nameEl = b.closest('.file-item');
      var nm = nameEl && nameEl.querySelector('.fi-name');
      deleteSaved(id, nm ? nm.textContent : '');
    } else openSaved(id);
  });

  /* --- 顶栏切换 --- */
  $('btnHome').addEventListener('click', goHome);
  $('btnInvMode').addEventListener('click', enterInventoryMode);

  /* --- 盘点模式 --- */
  $('btnInvBack').addEventListener('click', goHome);
  $('btnInvTable').addEventListener('click', backToTable);
  $('btnInvShare').addEventListener('click', openExportConfirm);
  $('btnInvAdd').addEventListener('click', addInvRow);
  $('invFieldSel').addEventListener('change', function () { invSearch(); });
  $('invSearchInput').addEventListener('input', invSearch);
  $('invSearchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var box = $('invSuggest');
      var first = box.querySelector('.sg-item');
      if (first) first.click();
    }
  });
  $('invList').addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('.inv-card') : null;
    if (card) openFillPage(parseInt(card.dataset.r, 10));
  });

  /* --- 填写页 --- */
  $('btnFillBack').addEventListener('click', function () {
    flushFillDraft(); // 未保存的输入先落进表格，返回列表也不丢
    $('fillMask').hidden = true;
    renderInv();
  });
  $('btnFillPrev').addEventListener('click', function () {
    var inv = state.inv;
    if (!inv) return;
    flushFillDraft();
    var idx = inv.rows.indexOf(inv.cur);
    openFillPage(inv.rows[(idx - 1 + inv.rows.length) % inv.rows.length]);
  });
  $('btnFillNext').addEventListener('click', function () {
    var inv = state.inv;
    if (!inv) return;
    flushFillDraft();
    var idx = inv.rows.indexOf(inv.cur);
    openFillPage(inv.rows[(idx + 1) % inv.rows.length]);
  });
  $('btnFillSave').addEventListener('click', saveFillPage);
  $('fillBody').addEventListener('click', function (e) { fillBodyAction(e.target); });
  // 填写页输入实时进草稿：拍照、切换记录、删除照片等重绘操作都不会丢未保存的内容
  $('fillBody').addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.id && t.id.indexOf('fi_') === 0) {
      if (!state.fillDraft) state.fillDraft = {};
      state.fillDraft[t.id.slice(3)] = t.value;
      backupDraft(); // 每打一个字就同步备份，进程被杀也不丢
    }
  });

  /* --- 盘点拍照（可连续多张，追加不覆盖） --- */
  $('filePhoto').addEventListener('change', function () {
    var f = $('filePhoto').files && $('filePhoto').files[0];
    $('filePhoto').value = '';
    var addr = state.pendingPhotoAddr;
    state.pendingPhotoAddr = null;
    if (!f || !addr || !state.inv) return;
    flushFillDraft(); // 拍照前先把未保存的输入落进表格（相机可能杀掉页面，先持久化）
    showLoading('正在处理照片…');
    loadImageFile(f).then(function (img) {
      hideLoading();
      setImage(state.inv.sheet, addr, img);
      if (state.inv.cur != null) openFillPage(state.inv.cur); // 刷新缩略图
    }).catch(function (err) {
      hideLoading();
      toast(err);
    });
  });

  /* --- 搜索 --- */
  var searchTimer = null;
  $('searchInput').addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { doSearch($('searchInput').value); }, 350);
  });
  $('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); gotoResult(1); }
  });
  $('btnNext').addEventListener('click', function () { gotoResult(1); });
  $('btnPrev').addEventListener('click', function () { gotoResult(-1); });
  $('btnCloseSearch').addEventListener('click', clearSearch);

  /* --- 工具栏 --- */
  $('btnUndo').addEventListener('click', undo);
  $('btnRedo').addEventListener('click', redo);
  $('btnRangeMode').addEventListener('click', function () { state.rangeMode ? exitRangeMode() : enterRangeMode(); });
  $('btnRangeCancel').addEventListener('click', function () { state.pickForImage = false; exitRangeMode(); renderGrid(); });
  $('btnFill').addEventListener('click', function () {
    if (!state.range) state.range = selAsRange();
    openRangePanel();
  });
  $('btnCheckbox').addEventListener('click', function () {
    if (!state.range) state.range = selAsRange();
    openRangePanel();
  });
  $('btnClear').addEventListener('click', function () {
    var tgt = state.range || selAsRange();
    if (!tgt) { toast('请先点击选择单元格，或点击行/列标题选择范围'); return; }
    var n = rangeCount(tgt);
    showConfirm('清空内容', '确定清空 ' + n + ' 个单元格的内容吗？可通过「撤销」恢复。',
      function () { clearCells(state.activeSheet, rangeAddrs(tgt)); }, '清空', true);
  });
  $('btnImage').addEventListener('click', function () {
    if (state.sel.r >= 0) { pickImageForCell(state.sel.r, state.sel.c); return; }
    state.pickForImage = true;
    state.rangeMode = false;
    showBanner('请点击要插入图片的单元格');
    renderGrid();
  });
  $('btnExport').addEventListener('click', openExportConfirm);

  /* --- 表格交互 --- */
  $('gridScroll').addEventListener('scroll', scheduleRender, { passive: true });
  window.addEventListener('resize', scheduleRender);
  $('cellWindow').addEventListener('click', function (e) {
    var cellEl = e.target.closest ? e.target.closest('.cell') : null;
    if (!cellEl) return;
    var key = cellEl.dataset.key;
    var parts = key.split(',');
    var r = parseInt(parts[0], 10), c = parseInt(parts[1], 10);
    var name = state.activeSheet, addr = rcToAddr(r, c);
    if (state.pickForImage) {          // 插图选点模式
      state.pickForImage = false;
      hideBanner();
      pickImageForCell(r, c);
      return;
    }
    if (state.rangeMode) {             // 范围选点模式
      pickRangePoint(r, c);
      return;
    }
    if (cbSetHas(name, addr)) {        // 复选框：点击切换勾选
      toggleCheckbox(name, addr);
      return;
    }
    state.sel = { r: r, c: c };        // 普通：选中并打开编辑面板
    state.range = null;
    renderGrid();
    openCellPanel(addr);
  });
  $('hdrLeft').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.rcell') : null;
    if (t) headerRowTap(parseInt(t.dataset.r, 10));
  });
  $('hdrTop').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.hcell') : null;
    if (t) headerColTap(parseInt(t.dataset.c, 10));
  });
  $('hdrCorner').addEventListener('click', function () {
    var ws = state.wb.Sheets[state.activeSheet];
    if (!ws['!ref']) return;
    var R = XLSX.utils.decode_range(ws['!ref']);
    state.pickForImage = false;
    exitRangeMode();
    state.range = norm(R.s.r, R.s.c, R.e.r, R.e.c);
    renderGrid();
    openRangePanel();
  });

  /* --- 图片选择 --- */
  $('fileImg').addEventListener('change', function () {
    var f = $('fileImg').files && $('fileImg').files[0];
    $('fileImg').value = '';
    var tgt = state.pendingImgCell;
    state.pendingImgCell = null;
    if (!f || !tgt) return;
    var addr = rcToAddr(tgt.r, tgt.c);
    showLoading('正在处理图片…');
    loadImageFile(f).then(function (img) {
      hideLoading();
      // 追加模式：多张图片共存，不覆盖
      setImage(state.activeSheet, addr, img);
    }).catch(function (err) {
      hideLoading();
      toast(err);
    });
  });

  /* --- 面板与对话框 --- */
  $('panel').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (b && panelActions[b.dataset.act]) panelActions[b.dataset.act]();
  });
  $('panelMask').addEventListener('click', function (e) { if (e.target === $('panelMask')) closePanel(); });
  $('modalMask').addEventListener('click', function (e) { if (e.target === $('modalMask')) hideModal(); });

  /* --- 工作表标签 --- */
  $('sheetTabs').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.stab') : null;
    if (b && b.dataset.name !== state.activeSheet) switchSheet(b.dataset.name);
  });

  updateUndoButtons();
  hideBanner();
  renderHome(); // 默认显示首页文件库
}

/* 入口（node 环境评测时不执行 DOM 逻辑） */
if (typeof document !== 'undefined') {
  if (typeof XLSX === 'undefined' || typeof JSZip === 'undefined') {
    /* 两套 CDN 均加载失败：给出明确提示，避免页面无声无息 */
    var onDom = function () { toast('组件库加载失败：请检查网络后刷新页面'); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', onDom);
    else onDom();
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
}
</script>
